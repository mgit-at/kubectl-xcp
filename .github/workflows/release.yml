name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: ./hack/release.sh "$GITHUB_REF_NAME"
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*.tar.gz dist/checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
      # The repo doubles as a custom krew index, which reads plugins/ on main.
      # The manifest is committed only after the release, so its URLs work.
      - run: |
          cp plugins/xcp.yaml "$RUNNER_TEMP/xcp.yaml"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p plugins
          cp "$RUNNER_TEMP/xcp.yaml" plugins/xcp.yaml
          git add plugins/xcp.yaml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "krew: xcp $GITHUB_REF_NAME"
          git push origin main
